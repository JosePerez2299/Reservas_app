<div class="h-full flex w-full flex-col p-7">
    <!-- Header con progreso a la derecha - ARRIBA -->
    <div class="bg-base-100 pb-4 flex items-center justify-between flex-shrink-0">
        <!-- Título a la izquierda -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-primary text-primary-content rounded-full flex items-center justify-center">
                <i class="fas fa-edit text-sm"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">Reserva de Espacios</h1>
                <p class="text-xs text-base-content/60">Sistema integral de gestión</p>
            </div>
        </div>

        <!-- Progreso Visual Compacto a la derecha -->
        <div id="progress" class="flex items-center gap-2">
            <!-- Paso 1 -->
            <div class="flex items-center gap-1">
                <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-primary text-primary-content" id="step-1">1</div>
                <span class="text-xs font-medium text-primary hidden sm:inline" id="step-1-text">Tipo</span>
            </div>
            <div class="w-3 h-0.5 bg-primary/30" id="progress-line-1"></div>
            
            <!-- Paso 2 -->
            <div class="flex items-center gap-1">
                <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-base-300 text-base-content/60" id="step-2">2</div>
                <span class="text-xs font-medium text-base-content/60 hidden sm:inline" id="step-2-text">Detalles</span>
            </div>
            <div class="w-3 h-0.5 bg-base-300" id="progress-line-2"></div>
            
            <!-- Paso 3 -->
            <div class="flex items-center gap-1">
                <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-base-300 text-base-content/60" id="step-3">3</div>
                <span class="text-xs font-medium text-base-content/60 hidden sm:inline" id="step-3-text">Confirmar</span>
            </div>
        </div>
    </div>
    
    <!-- Divisor -->
    <div class="divider mt-0"></div>

    <!-- Contenedor dinámico - ABAJO -->
    <div id="wizard-container" class="flex-1 overflow-auto"
         hx-get="{% url 'reserva_create_step1' %}"
         hx-trigger="load">
        <!-- Spinner inicial -->
        <div class="flex flex-col items-center justify-center py-12 space-y-4 h-full">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <p class="text-base-content/70">Cargando formulario...</p>
        </div>
    </div>
</div>

<!-- Script progreso y spinner -->
<script>
// Función para mostrar el spinner en el wizard
function showWizardSpinner() {
    const wizardContainer = document.getElementById('wizard-container');
    wizardContainer.innerHTML = `
        <div class="flex flex-col items-center justify-center py-12 space-y-4">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <p class="text-base-content/70">Cargando...</p>
        </div>
    `;
}

// Evento antes de hacer la petición HTMX - mostrar spinner
document.body.addEventListener("htmx:beforeRequest", function(evt) {
    if (evt.target.id === "wizard-container" || evt.target.closest("#wizard-container")) {
        showWizardSpinner();
    }
});

// Evento después del intercambio - actualizar progreso
document.body.addEventListener("htmx:afterSwap", function(evt) {
    if (evt.target.id === "wizard-container") {
        const stepDiv = evt.target.querySelector("[data-step]");
        if (stepDiv) {
            updateProgress(parseInt(stepDiv.dataset.step));
        }
    }
});

// Manejar errores de carga en el wizard
document.body.addEventListener("htmx:responseError", function(evt) {
    if (evt.target.id === "wizard-container") {
        const wizardContainer = document.getElementById('wizard-container');
        wizardContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 space-y-4">
                <div class="text-error text-6xl">⚠️</div>
                <p class="text-error font-semibold">Error al cargar el contenido</p>
                <button class="btn btn-sm btn-outline" onclick="location.reload()">Reintentar</button>
            </div>
        `;
    }
});

// Manejar problemas de conexión en el wizard
document.body.addEventListener("htmx:sendError", function(evt) {
    if (evt.target.id === "wizard-container") {
        const wizardContainer = document.getElementById('wizard-container');
        wizardContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 space-y-4">
                <div class="text-warning text-6xl">🌐</div>
                <p class="text-warning font-semibold">Sin conexión a internet</p>
                <button class="btn btn-sm btn-outline" onclick="location.reload()">Reintentar</button>
            </div>
        `;
    }
});

function updateProgress(step) {
    // reset círculos y textos
    ["1","2","3"].forEach(n => {
        document.getElementById("step-"+n).className =
            "w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-base-300 text-base-content/60";
        document.getElementById("step-"+n+"-text").className =
            "text-xs font-medium text-base-content/60";
    });
    // reset líneas
    ["1","2"].forEach(n => {
        document.getElementById("progress-line-"+n).className = "w-3 h-0.5 bg-base-300";
    });

    // marcar pasos previos como completados
    for (let i=1; i<step; i++) {
        setDone(i);
        if (document.getElementById("progress-line-"+i)) {
            document.getElementById("progress-line-"+i).className = "w-3 h-0.5 bg-success";
        }
    }
    // marcar activo
    setActive(step);
}

function setActive(n) {
    document.getElementById("step-"+n).className =
        "w-6 h-6 bg-primary text-primary-content rounded-full flex items-center justify-center text-xs font-bold";
    document.getElementById("step-"+n+"-text").className =
        "text-xs font-medium text-primary";
}

function setDone(n) {
    document.getElementById("step-"+n).className =
        "w-6 h-6 bg-success text-success-content rounded-full flex items-center justify-center text-xs font-bold";
    document.getElementById("step-"+n+"-text").className =
        "text-xs font-medium text-success";
}
</script>
