<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login & register</title>
    <link rel="stylesheet" href="stilos_login.css">
</head>
<body>
    <div class="contenedor">
         
        <div class="contenedor_form">

            <form class="sign_in">
                <h2> Iniciar sesion </h2>
                <div class="social_netword">
                <ion-icon name="logo-twitch"></ion-icon>
                <ion-icon name="logo-twitter"></ion-icon>
                <ion-icon name="logo-tiktok"></ion-icon>
                <ion-icon name="logo-facebook"></ion-icon>
                <ion-icon name="logo-instagram"></ion-icon>
            </div>
            <span> Uses su correo y contraseña  </span>
            <div class="contenedor_input">
                  <ion-icon name="mail-outline"></ion-icon>
                  <input type="text" placeholder="mail">
                </div>
                <div class="contenedor_input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="password" >
                  </div> 
                  <a href="#">¿olvidaste tu contraseña?</a>
                     <button class="botton"> INICIAR SESION </button>
                </div>

            </form>

            /*  comentario git*/

            <form class="sign_up">
            <div class="contenedor_form">
            <h2>Registrarce</h2>   
            <div class="social_netword">
                <ion-icon name="logo-twitch"></ion-icon>
                <ion-icon name="logo-twitter"></ion-icon>
                <ion-icon name="logo-tiktok"></ion-icon>
                <ion-icon name="logo-facebook"></ion-icon>
                <ion-icon name="logo-instagram"></ion-icon>
            </div>
            <span> Use su correo para registrarce </span>
            <div class="contenedor_input">
                <ion-icon name="person-outline"></ion-icon>
                  <input type="text" placeholder="Nombre">
                </div>
                <div class="contenedor_input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="text" placeholder="mail">
                  </div>
                <div class="contenedor_input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="password" >
                  </div> 
                     <button class="botton"> REGISTRARCE </button>
                    </form>
                </div>
              </div>
    
    <script src=/"scrip_login.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
